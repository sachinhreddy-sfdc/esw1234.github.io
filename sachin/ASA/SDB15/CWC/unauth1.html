			console.log("onEmbeddedMessagingConversationParticipantChanged event received", event.detail);
			let participantChangedEntryPayload;
			let parsedPayload;
			try {
  				participantChangedEntryPayload = JSON.parse((event?.detail?.conversationEntry?.entryPayload ?? "").replaceAll("\\", ""));
			} catch (error) {
  				console.error("Failed to parse entryPayload:", error);
  				participantChangedEntryPayload = null;
			}
 			if (participantChangedEntryPayload?.entries?.[0]?.operation === 'add' && participantChangedEntryPayload?.entries?.[0]?.participant?.role === 'Chatbot') {
  				// Chatbot participant has joined -> hide file attachment button
				let chat_iframe = embeddedservice_bootstrap.utilAPI.getEmbeddedMessagingFrame();
				if (chat_iframe) {

					chat_iframe.contentWindow.postMessage(
                  		{

              		);
				}
			} else if (participantChangedEntryPayload?.entries?.[0]?.operation === 'add' && participantChangedEntryPayload?.entries?.[0]?.participant?.role === 'Agent') {
  				// Human participant has joined -> show file attachment button
				let chat_iframe = embeddedservice_bootstrap.utilAPI.getEmbeddedMessagingFrame();
